name: Build plugin on ES release

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      es_version:
        description: "Elasticsearch version to build (e.g., 9.2.4)"
        required: true
        type: string
      create_release:
        description: "Create GitHub release (true/false)"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

env:
  TINY_BRANCH: dictabert-tiny

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out DictaBERT-Lex source
        uses: actions/checkout@v5

      - name: Resolve Elasticsearch version
        id: es
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            es_version="${{ inputs.es_version }}"
            es_tag="v${es_version}"
          else
            es_tag=$(gh api repos/elastic/elasticsearch/releases/latest --jq .tag_name)
            es_version="${es_tag#v}"
          fi
          echo "es_tag=${es_tag}" >> "$GITHUB_OUTPUT"
          echo "es_version=${es_version}" >> "$GITHUB_OUTPUT"

      - name: Check release assets
        id: release
        env:
          ES_TAG: ${{ steps.es.outputs.es_tag }}
          ES_VERSION: ${{ steps.es.outputs.es_version }}
        run: |
          lex_asset="heb-lemmas-embedded-plugin-${ES_VERSION}.zip"
          tiny_asset="heb-lemmas-embedded-tiny-plugin-${ES_VERSION}.zip"
          if gh release view "${ES_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            assets="$(gh release view "${ES_TAG}" --json assets --jq '.assets[].name')"
            if [[ "${assets}" == *"${lex_asset}"* && "${assets}" == *"${tiny_asset}"* ]]; then
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out DictaBERT Tiny source
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TINY_BRANCH }}
          path: tiny-source

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        uses: actions/setup-python@v6
        with:
          # onnxruntime 1.26 requires Python 3.11 or newer.
          python-version: "3.12"

      - name: Install Python dependencies
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        run: |
          python -m pip install -U pip
          pip install -r hebrew-lemmatizer-embedded/model-export/requirements.txt
          # Tiny pins its own export dependencies; do not rely on the Lex list
          # happening to be a superset of them.
          pip install -r tiny-source/hebrew-lemmatizer-embedded/model-export/requirements.txt

      - name: Build DictaBERT-Lex plugin
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        run: |
          ./scripts/build_plugin_linux.sh --es-version "${{ steps.es.outputs.es_version }}"

      - name: Build DictaBERT Tiny plugin
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        env:
          ES_VERSION: ${{ steps.es.outputs.es_version }}
        run: |
          ./tiny-source/scripts/build_plugin_linux.sh --es-version "${ES_VERSION}"
          tiny_source="tiny-source/hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-plugin-${ES_VERSION}.zip"
          tiny_target="hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-tiny-plugin-${ES_VERSION}.zip"
          cp "${tiny_source}" "${tiny_target}"

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-plugins-es-${{ steps.es.outputs.es_version }}
          if-no-files-found: error
          path: |
            hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-plugin-${{ steps.es.outputs.es_version }}.zip
            hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-tiny-plugin-${{ steps.es.outputs.es_version }}.zip

      - name: Create or update release with both plugin variants
        if: (github.event_name == 'schedule' || inputs.create_release == 'true') && (github.event_name == 'workflow_dispatch' || steps.release.outputs.needs_build == 'true')
        env:
          ES_TAG: ${{ steps.es.outputs.es_tag }}
          ES_VERSION: ${{ steps.es.outputs.es_version }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          lex_zip="hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-plugin-${ES_VERSION}.zip"
          tiny_zip="hebrew-lemmatizer-embedded/plugin-lemmas-embedded/build/distributions/heb-lemmas-embedded-tiny-plugin-${ES_VERSION}.zip"
          # Each variant has its own model, and each plugin build verifies the
          # model against its committed model-cache-key.txt. Publish both under
          # distinct names so they cannot be mixed up.
          model_dir="release-models"
          mkdir -p "${model_dir}"
          cp "hebrew-lemmatizer-embedded/plugin-lemmas-embedded/src/main/resources/model/model.onnx" \
            "${model_dir}/model-lex.onnx"
          cp "tiny-source/hebrew-lemmatizer-embedded/plugin-lemmas-embedded/src/main/resources/model/model.onnx" \
            "${model_dir}/model-tiny.onnx"
          if [[ "${RELEASE_EXISTS}" == "true" ]]; then
            gh release upload "${ES_TAG}" \
              "${lex_zip}" "${tiny_zip}" \
              "${model_dir}/model-lex.onnx" "${model_dir}/model-tiny.onnx" --clobber
          else
            notes_file="release-notes.md"
            {
              echo "Embedded Hebrew analyzer plugins for ES ${ES_VERSION}: DictaBERT-Lex and the higher-throughput DictaBERT Tiny alternative."
              echo
              echo "- \`heb-lemmas-embedded-plugin-${ES_VERSION}.zip\` - DictaBERT-Lex variant (standalone model: \`model-lex.onnx\`)"
              echo "- \`heb-lemmas-embedded-tiny-plugin-${ES_VERSION}.zip\` - DictaBERT Tiny variant (standalone model: \`model-tiny.onnx\`)"
              echo
              echo "Both zips already embed their model; the standalone \`.onnx\` assets are only needed for local builds and must match the \`model-cache-key.txt\` of the matching branch."
              echo "Both variants install under the same plugin id, so only one can be installed per node - run \`elasticsearch-plugin remove heb-lemmas-embedded-plugin\` before switching variants."
            } > "${notes_file}"
            gh release create "${ES_TAG}" \
              "${lex_zip}" "${tiny_zip}" \
              "${model_dir}/model-lex.onnx" "${model_dir}/model-tiny.onnx" \
              --title "Elasticsearch ${ES_VERSION} plugins" \
              --notes-file "${notes_file}"
          fi
